# Staff editing screen (Pages CMS, https://pagescms.org).
# This file tells the editing screen which parts of the site staff can change
# and what each form looks like. Saving a form commits to this repository,
# and GitHub then rebuilds and publishes the site within about two minutes.

media:
  input: src/assets/photos
  output: /assets/photos
  extensions: [jpg]

content:
  - name: news
    label: News and updates
    type: file
    path: src/_data/newsItems.json
    format: json
    list: true
    fields:
      - name: title_en
        label: Title (English)
        type: string
        description: Fill in at least one title. If a language is left empty, the other language is shown on that version of the site.
      - name: title_bn
        label: Title (Bangla)
        type: string
      - name: type
        label: Kind of item
        type: select
        required: true
        options:
          values:
            - name: update
              label: From Radda (gets its own page on the site)
            - name: press
              label: In the press (links to another website)
      - name: url
        label: Link to the article
        type: string
        description: Only for press items. Paste the full address, starting with https://
      - name: summary_en
        label: Summary (English)
        type: text
        description: One or two sentences, shown in the news list.
      - name: summary_bn
        label: Summary (Bangla)
        type: text
      - name: body_en
        label: Full text (English)
        type: text
        description: Only for items from Radda. Leave an empty line between paragraphs. If empty, the summary is used.
      - name: body_bn
        label: Full text (Bangla)
        type: text
      # Dates here are plain text on purpose: the date picker fills an empty
      # field with today's date, which would put a wrong date on old items.
      - name: date_text_en
        label: Date (English)
        type: string
        description: As it should appear, for example "16 November 2026" or "October 2026". Can be left empty.
      - name: date_text_bn
        label: Date (Bangla)
        type: string
        description: For example "১৬ নভেম্বর ২০২৬". If empty, the English date is shown.
      - name: source_en
        label: Source (English)
        type: string
        description: For press items, the name of the newspaper or website. Leave empty for items from Radda.
      - name: source_bn
        label: Source (Bangla)
        type: string
      - name: notice
        label: Show in the notice bar at the top of the home page
        type: boolean
      - name: notice_until
        label: Last day to show the notice (optional)
        type: string
        description: Type the date as year-month-day in English digits, for example 2027-01-31. The notice disappears after that day. Leave empty to keep it until it is switched off above.
        pattern:
          regex: "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$"
          message: "Write the date like 2027-01-31, or leave this empty"
      - name: id
        label: Short name for the web address (optional)
        type: string
        description: Lowercase English letters, numbers and hyphens, for example "eid-holiday-hours". Do not change it after the item is published, or old links will stop working.
        pattern: "^[a-z0-9-]*$"

  - name: holidays
    label: Government holidays
    type: file
    path: src/_data/holidays.json
    format: json
    list: true
    fields:
      - name: date
        label: Date the centre is closed
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: name
        label: Name of the holiday (for your own reference)
        type: string

  - name: trustees
    label: Board of Trustees
    type: file
    path: src/_data/trustees.json
    format: json
    list: true
    fields:
      - name: name
        label: Name (English)
        type: string
        required: true
      - name: name_bn
        label: Name (Bangla)
        type: string
        description: Optional. Until this is filled in, the English name is shown on the Bangla page.
      - name: role
        label: Role
        type: select
        required: true
        options:
          values:
            - name: chair
              label: Chairperson
            - name: treasurer
              label: Treasurer and Member
            - name: member
              label: Member

  - name: contact
    label: Contact details
    type: file
    path: src/_data/contact.json
    format: json
    fields:
      - name: phone
        label: Phone number
        type: string
        required: true
        description: As it should appear on the site, with the country code, for example +880 1335-097710
      - name: whatsapp
        label: WhatsApp number
        type: string
        required: true
        description: Digits only, with the country code and no plus sign, for example 8801335097710. Visit requests are sent to this number.
        pattern: "^[0-9]{10,15}$"
      - name: email
        label: Email address
        type: string
        required: true
      - name: facebook_url
        label: Facebook page link
        type: string
        required: true
        description: The full address, starting with https://

  - name: appeal
    label: Rebuild appeal
    type: file
    path: src/_data/appealSettings.json
    format: json
    fields:
      - name: published
        label: Show the "Help rebuild Radda" page
        type: boolean
        description: Switch this off to remove the page and every link to it.
      - name: bank_account_name
        label: Bank account name
        type: string
        description: The bank details appear on the page only when the account name, bank and account number are all filled in.
      - name: bank_name
        label: Bank
        type: string
      - name: bank_branch
        label: Branch
        type: string
      - name: bank_account_number
        label: Bank account number
        type: string
      - name: bank_routing_number
        label: Routing number (optional)
        type: string
      - name: bkash_number
        label: bKash number
        type: string
        description: Digits only, for example 01712345678. Leave empty if there is none.
        pattern:
          regex: "^([0-9]{11,14})?$"
          message: "Digits only, or leave this empty"
      - name: bkash_kind
        label: Kind of bKash account
        type: select
        options:
          values:
            - name: merchant
              label: Merchant (givers use Payment)
            - name: personal
              label: Personal (givers use Send Money)
      - name: nagad_number
        label: Nagad number
        type: string
        description: Digits only. Leave empty if there is none.
        pattern:
          regex: "^([0-9]{11,14})?$"
          message: "Digits only, or leave this empty"
